spring:
  datasource:
    url: jdbc:mysql://localhost:3306/medicore_test?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: medicore
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: false
